name: Task
description: A piece of work that becomes one branch and one PR. Needs at least one area/* label, one per commit scope it touches (area/tooling without one); a check comments if it has none.
type: Task
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem, and who it is for.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What should exist when this is done. Leave out how, unless it matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable acceptance criteria, one per line. More than about ten means split it.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, what is deliberately out of scope. Record blockers as "blocked by" relationships, not here.
