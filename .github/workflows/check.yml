name: Check

# The full quality gate (typecheck, ESLint, Prettier, knip, jscpd, tests; `turbo.json`) on every
# PR, whatever its base, so the lint rules (layer boundaries, `harness/no-terminal-io`: no UI
# outside the named front-end files) block a merge, not just a Cursor session. It runs as six
# parallel jobs (`check:repo`, `check:typecheck`, `check:lint`, `check:test`,
# `check:eslint-config`, `check:root`) that together are `npm run check`.
# A PR runs the workspace and root tasks only for what its changes affect (`--affected`, as in
# `npm run check:affected`); the repo-wide checks always run.
# Pushes to main run it too, so PRs restore a turbo cache from main (a PR's own cache is scoped to
# its branch).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Parallel jobs instead of one long one: the cheap repo-wide checks report a failure within about
  # a minute, and the slow groups no longer share one 4-vCPU runner. Together they run exactly
  # what `npm run check` runs.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repo checks
            script: check:repo
            affected: false
          - name: typecheck
            script: check:typecheck
            affected: true
          - name: lint
            script: check:lint
            affected: true
          - name: workspace tests
            script: check:test
            affected: true
          # Its tests are the longest task of the gate, so they get a runner of their own.
          - name: eslint-config tests
            script: check:eslint-config
            affected: true
          - name: root
            script: check:root
            affected: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # `--affected` compares with the base branch; a shallow clone would rerun everything.
          # A push to main runs every task unfiltered, so it needs no history. The depths are
          # strings: `&&`/`||` return their operands and a number 0 is falsy, so `&& 0 || 1` is 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Results keyed by inputs, so a restored entry is only reused where nothing changed.
      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.script }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.script }}-

      # Some tests make throwaway git repos and commits; give them an identity. Main runs every
      # task, so the cache it saves is complete.
      - name: Check
        run: npm run ${{ matrix.script }}${{ matrix.affected && github.event_name == 'pull_request' && ' -- --affected' || '' }}
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
          # Turbo could not find the base branch on its own ("unable to detect git range") and ran
          # every task on every PR. Passed as env, never into the script text.
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          # Per-task hashes and cache status, to find out why tasks miss the cache.
          TURBO_RUN_SUMMARY: 'true'

      - name: Upload the turbo run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Not `matrix.script`: its colon is not allowed in an artifact name.
          name: turbo-summary-${{ matrix.name }}
          path: .turbo/runs
          # `.turbo` is a hidden folder, which v4 skips unless asked; a miss should show as a warning.
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          retention-days: 7
