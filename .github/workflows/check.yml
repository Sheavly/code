name: Check

# The full quality gate (typecheck, ESLint, Prettier, knip, jscpd, tests; `turbo.json`) on every
# PR, whatever its base, so the lint rules (layer boundaries, `harness/no-terminal-io`: no UI
# outside the named front-end files) block a merge, not just a Cursor session. A PR runs only the
# workspaces its changes affect (`npm run check:affected`); the repo-wide checks always run.
# Pushes to main run it too, so PRs restore a turbo cache from main (a PR's own cache is scoped to
# its branch).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # `--affected` compares with the base branch; a shallow clone would rerun everything.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Results keyed by inputs, so a restored entry is only reused where nothing changed.
      - name: Restore the turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Some tests make throwaway git repos and commits; give them an identity. Main runs every
      # task, so the cache it saves is complete.
      - name: Check
        run: npm run ${{ github.event_name == 'push' && 'check' || 'check:affected' }}
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
