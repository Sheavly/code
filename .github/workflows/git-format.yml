name: Git format

# The PR title becomes the squashed commit on main, and the body's `Closes #123` (or `Part of #123`
# for a stack layer) links the PR to its GitHub issue, whose `area/*` labels must cover every
# commit scope; its `## Harness impact` section names ESLint or git workflow enforcement and
# regression-test evidence (or `none: <reason>`). This validates reporting, not actual coverage.
# Runs on every PR whatever its base, so a stacked PR based on another
# issue branch is checked too. Separate from any build so a title or body edit reruns only this quick check;
# after labelling the issue, rerun the check (`gh run rerun`) or push.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: git-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The PR's commits and its issue's area labels, read with `gh`.
  issues: read
  pull-requests: read

jobs:
  format:
    name: PR title, body and branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Passed through env, never interpolated into the script: a title or body is untrusted input.
      - name: Check the PR title, body, branch and area labels
        run: node scripts/check-git-format.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
