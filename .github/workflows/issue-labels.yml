name: Issue labels

# Every open issue needs at least one `area/*` label, one per commit scope its PR will have
# (scripts/check-issue-areas.mjs). Issue forms can't pick labels, so this catches an issue
# without one, fails, and comments once. Runs one at a time per issue, newest last: the script
# reads the issue as it is now, so the last of a burst of label events decides.
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]

concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  areas:
    name: Area labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check the issue's area labels
        run: node scripts/check-issue-areas.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
