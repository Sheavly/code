name: Sync labels

# One `area/<scope>` issue label per commit scope, plus `area/tooling` and `security`
# (scripts/sync-area-labels.mjs), so a new package or app gets its label when it lands on
# main. A label whose folder is gone is deleted once no open issue has it, and reported until then.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-labels
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Area labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Sync the area labels
        run: node scripts/sync-area-labels.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
