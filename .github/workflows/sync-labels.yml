name: Sync labels

# One `area/<scope>` issue label per commit scope, plus `area/tooling` and `security`
# (scripts/sync-area-labels.mjs), so a new package or src/ folder gets its label when it lands on
# main. A label whose folder is gone is deleted once no open issue has it, and reported until then.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-labels
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Area labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Sync the area labels
        run: node scripts/sync-area-labels.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
